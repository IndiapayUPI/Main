<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADYNEX | Performance Growth Agency</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --text: #ffffff;
      --muted: #a3a3a3;
      --border: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow-x: hidden;
    }

    /* Grayscale stadium backdrop at 16% opacity */
    .backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('https://i.pinimg.com/736x/95/56/c3/9556c3f07601b6a533d2e9c204a2d37e.jpg');
      background-size: cover;
      background-position: center;
      filter: grayscale(100%) contrast(140%);
      opacity: 0.16;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* Expanding border pulse avatar */
    .avatar-wrapper {
      position: relative;
      width: 104px;
      height: 104px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-pulse {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.7);
      animation: avatarPulse 2.4s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
    }

    @keyframes avatarPulse {
      0% {
        transform: scale(0.95);
        opacity: 0.8;
      }
      70% {
        transform: scale(1.35);
        opacity: 0;
      }
      100% {
        transform: scale(1.4);
        opacity: 0;
      }
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #ffffff;
      background-color: #000;
      position: relative;
      z-index: 2;
    }

    /* Pill badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 14px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.05);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 14px;
    }

    .badge-indicator {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    p.tagline {
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.4;
      margin-bottom: 28px;
      max-width: 300px;
    }

    /* Action buttons with dual-layer expanding ripple animation */
    .cta-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 36px;
    }

    .cta-button {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 16px 20px;
      background: #000000;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      color: #ffffff;
      text-decoration: none;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
      box-shadow: 0 4px 18px rgba(255, 255, 255, 0.08);
      transition: transform 0.15s ease, background-color 0.2s ease;
    }

    .cta-button:active {
      transform: scale(0.98);
    }

    /* Dual-layer ripple pseudo-elements */
    .cta-button.has-ripple::before,
    .cta-button.has-ripple::after {
      content: '';
      position: absolute;
      inset: -1.5px;
      border-radius: 12px;
      border: 1.5px solid #ffffff;
      pointer-events: none;
    }

    .cta-button.has-ripple::before {
      animation: rippleLayer 2.8s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    }

    .cta-button.has-ripple::after {
      animation: rippleLayer 2.8s cubic-bezier(0, 0.2, 0.8, 1) infinite 1.4s;
    }

    @keyframes rippleLayer {
      0% {
        transform: scale(1);
        opacity: 0.8;
      }
      80% {
        transform: scale(1.04, 1.25);
        opacity: 0;
      }
      100% {
        transform: scale(1.05, 1.28);
        opacity: 0;
      }
    }

    /* Bottom 3-column stats divider */
    .stats-card {
      width: 100%;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      padding-top: 24px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-number {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 2px;
    }

    .stat-label {
      font-size: 0.65rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <div class="backdrop"></div>

  <div class="container">
    <div class="avatar-wrapper">
      <div class="avatar-pulse"></div>
      <img src="https://i.pinimg.com/736x/58/59/ad/5859add7668ade7a68efa9e79b7f82ec.jpg" alt="ADYNEX" class="avatar">
    </div>

    <div class="badge">
      <span class="badge-indicator"></span>
      All-In-One Ads Partner
    </div>

    <h1>ADYNEX</h1>
    <p class="tagline">Data-driven performance media buying, creative scaling, and elite growth solutions.</p>

    <div class="cta-group">
      <!-- Primary conversion button with dual-layer ripple -->
      <a href="https://t.me/adynex" class="cta-button has-ripple" target="_blank" rel="noopener noreferrer">
        Launch Your Campaigns
      </a>

      <!-- Group community chat button -->
      <a href="https://t.me/+CSr_JvEq9-M1ODM1" class="cta-button" target="_blank" rel="noopener noreferrer">
        Join Growth Network
      </a>
    </div>

    <div class="stats-card">
      <div class="stat-item">
        <span class="stat-number">4.8x</span>
        <span class="stat-label">Avg ROAS</span>
      </div>
      <div class="stat-item">
        <span class="stat-number">$12M+</span>
        <span class="stat-label">Ad Spend</span>
      </div>
      <div class="stat-item">
        <span class="stat-number">24/7</span>
        <span class="stat-label">Execution</span>
      </div>
    </div>
  </div>

</body>
</html>
