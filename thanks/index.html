<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You | Access Confirmed</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background-color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.05);
      text-align: center;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      background: #eff6ff;
      color: #1d4ed8;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .icon-wrap {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #dbeafe;
      color: #2563eb;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-wrap svg {
      width: 32px;
      height: 32px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.3;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: #64748b;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 13px 20px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .btn-tg {
      background: #0088cc;
      color: #ffffff;
      border: 1px solid transparent;
    }

    .btn-tg:hover {
      background: #0077b5;
    }

    .divider {
      position: relative;
      margin: 6px 0;
      text-align: center;
    }

    .divider::before {
      content: "";
      position: absolute;
      left: 0;
      top: 50%;
      width: 100%;
      height: 1px;
      background: #e2e8f0;
    }

    .divider span {
      position: relative;
      background: #ffffff;
      padding: 0 10px;
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .btn-wa {
      background: #ffffff;
      color: #15803d;
      border: 1px solid #bbf7d0;
    }

    .btn-wa:hover {
      background: #f0fdf4;
      border-color: #86efac;
    }

    .redirect-status {
      margin-top: 20px;
      font-size: 13px;
      color: #64748b;
    }

    .counter-pill {
      display: inline-block;
      font-weight: 700;
      color: #1d4ed8;
      background: #f1f5f9;
      padding: 2px 7px;
      border-radius: 6px;
      margin-left: 3px;
    }
  </style>
</head>
<body>

  <main class="card">
    
    <div class="status-badge">
      <span>✓ Access Confirmed</span>
    </div>

    <div class="icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
    </div>

    <h1>Thank You for Joining!</h1>
    <p class="subtitle">You are being redirected to our official Telegram community for daily market updates and resources.</p>

    <div class="btn-group">
      <!-- Telegram Action -->
      <a href="https://t.me/+iUDfq2tNi6E4MzA1" class="btn btn-tg" id="tgBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.52 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .34z"/>
        </svg>
        Continue to Telegram
      </a>

      <div class="divider">
        <span>or</span>
      </div>

      <!-- WhatsApp Action -->
      <a href="https://wa.me/917357071060?text=Hi%2C%20I%20don%27t%20have%20Telegram.%20I%20want%20to%20learn%20Stock%20Market%20and%20Data%20Analytics." class="btn btn-wa" id="waBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91C2.13 13.66 2.59 15.36 3.45 16.86L2.05 22L7.3 20.62C8.75 21.41 10.38 21.83 12.04 21.83C17.5 21.83 21.95 17.38 21.95 11.92C21.95 9.27 20.92 6.78 19.05 4.91C17.18 3.03 14.69 2 12.04 2M12.05 3.67C14.25 3.67 16.31 4.53 17.87 6.09C19.42 7.65 20.28 9.72 20.28 11.92C20.28 16.46 16.58 20.15 12.04 20.15C10.56 20.15 9.11 19.76 7.85 19.01L7.55 18.83L4.43 19.65L5.26 16.61L5.06 16.29C4.24 14.99 3.8 13.47 3.8 11.91C3.81 7.37 7.5 3.67 12.05 3.67M9.53 7.03C9.36 7.03 9.09 7.1 8.87 7.33C8.65 7.57 8.02 8.16 8.02 9.36C8.02 10.57 8.9 11.74 9.02 11.9C9.15 12.07 10.74 14.52 13.18 15.57C13.76 15.82 14.21 15.97 14.57 16.08C15.16 16.27 15.69 16.24 16.12 16.18C16.6 16.11 17.59 15.58 17.8 15C18.01 14.41 18.01 13.91 17.94 13.8C17.88 13.7 17.72 13.64 17.48 13.52C17.23 13.4 16.01 12.8 15.78 12.72C15.55 12.63 15.39 12.59 15.22 12.83C15.06 13.07 14.59 13.64 14.44 13.8C14.3 13.97 14.16 14 13.92 13.88C13.68 13.76 12.9 13.5 11.98 12.68C11.26 12.04 10.78 11.25 10.64 11.01C10.5 10.77 10.62 10.64 10.75 10.52C10.86 10.41 10.99 10.23 11.12 10.09C11.24 9.94 11.29 9.83 11.37 9.67C11.45 9.5 11.41 9.36 11.35 9.24C11.29 9.12 10.8 7.92 10.6 7.43C10.4 6.96 10.2 7.02 10.05 7.02L9.53 7.03Z"/>
        </svg>
        Connect on WhatsApp
      </a>
    </div>

    <div class="redirect-status" id="statusWrap">
      Redirecting in <span class="counter-pill" id="counter">4s</span>
    </div>

  </main>

  <script>
    let timeLeft = 4;
    const counterEl = document.getElementById('counter');
    const statusWrap = document.getElementById('statusWrap');
    const tgUrl = "https://t.me/+iUDfq2tNi6E4MzA1";

    const timer = setInterval(() => {
      timeLeft--;
      if (counterEl) counterEl.textContent = timeLeft + 's';
      if (timeLeft <= 0) {
        clearInterval(timer);
        window.location.href = tgUrl;
      }
    }, 1000);

    // Agar user WhatsApp par click kare toh auto-redirect band kar do
    document.getElementById('waBtn').addEventListener('click', () => {
      clearInterval(timer);
      if (statusWrap) statusWrap.style.display = 'none';
    });
  </script>
</body>
</html>
