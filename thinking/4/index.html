<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thinking...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
    <style>
        /* Pure black void */
        body, html {
            background-color: #000000;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        /* 3D Gyroscope / Quantum AI Sphere Container */
        .quantum-stage {
            position: relative;
            width: 180px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 900px;
            transform-style: preserve-3d;
        }

        /* Deep subtle aura */
        .void-aura {
            position: absolute;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.04) 45%, rgba(0, 0, 0, 0) 70%);
            filter: blur(24px);
            animation: aura-pulse 4s ease-in-out infinite alternate;
            pointer-events: none;
        }

        /* 3D Intersecting Orbital Ribbons */
        .orbital-ring {
            position: absolute;
            width: 124px;
            height: 124px;
            border-radius: 50%;
            transform-style: preserve-3d;
        }

        .orbital-1 {
            border-top: 2px solid rgba(255, 255, 255, 0.95);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            border-left: 1px solid transparent;
            border-right: 1px solid transparent;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.25), inset 0 0 15px rgba(255, 255, 255, 0.15);
            animation: gyro-1 4.5s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
        }

        .orbital-2 {
            width: 108px;
            height: 108px;
            border-left: 2px solid rgba(255, 255, 255, 0.85);
            border-right: 1px solid rgba(255, 255, 255, 0.15);
            border-top: 1px solid transparent;
            border-bottom: 1px solid transparent;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.2), inset 0 0 15px rgba(255, 255, 255, 0.12);
            animation: gyro-2 5.5s linear infinite;
        }

        .orbital-3 {
            width: 92px;
            height: 92px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.75);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            border-left: 1px solid transparent;
            border-right: 1px solid transparent;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.15), inset 0 0 15px rgba(255, 255, 255, 0.1);
            animation: gyro-3 3.8s ease-in-out infinite alternate;
        }

        .orbital-4 {
            width: 142px;
            height: 142px;
            border: 1px dashed rgba(255, 255, 255, 0.18);
            animation: spin-flat 18s linear infinite;
        }

        /* Monochrome Liquid Plasma Core */
        .plasma-orb {
            position: relative;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: conic-gradient(
                from 0deg,
                #ffffff,
                #000000,
                #ffffff,
                #000000,
                #ffffff
            );
            filter: blur(3px);
            animation: plasma-spin 2.5s linear infinite, plasma-breathe 2s ease-in-out infinite alternate;
            box-shadow: 
                0 0 20px rgba(255, 255, 255, 0.6),
                0 0 45px rgba(255, 255, 255, 0.3);
        }

        /* Crisp Dark Inner Eclipse for High-Tech Contrast */
        .orb-eclipse {
            position: absolute;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #000000;
            box-shadow: inset 0 0 8px rgba(255, 255, 255, 0.5);
            z-index: 2;
        }

        /* Center Starlight Spark */
        .center-spark {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 12px 3px #ffffff;
            z-index: 3;
            animation: spark-flicker 1.8s ease-in-out infinite;
        }

        /* Equalizer / Synapse Wave Bars */
        .wave-bar {
            width: 2px;
            background: linear-gradient(to top, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.1));
            border-radius: 9999px;
            animation: equalizer 1.2s ease-in-out infinite;
        }

        .wave-bar:nth-child(1) { height: 6px; animation-delay: 0.0s; }
        .wave-bar:nth-child(2) { height: 14px; animation-delay: 0.15s; }
        .wave-bar:nth-child(3) { height: 20px; animation-delay: 0.3s; }
        .wave-bar:nth-child(4) { height: 14px; animation-delay: 0.45s; }
        .wave-bar:nth-child(5) { height: 6px; animation-delay: 0.6s; }

        /* Shimmering Text */
        .thinking-label {
            background: linear-gradient(
                90deg, 
                rgba(255, 255, 255, 0.2) 0%, 
                rgba(255, 255, 255, 0.95) 50%, 
                rgba(255, 255, 255, 0.2) 100%
            );
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shimmer 3s linear infinite;
        }

        /* Keyframe Animations */
        @keyframes gyro-1 {
            0% { transform: rotateX(65deg) rotateY(15deg) rotateZ(0deg); }
            50% { transform: rotateX(45deg) rotateY(-35deg) rotateZ(180deg); }
            100% { transform: rotateX(65deg) rotateY(15deg) rotateZ(360deg); }
        }

        @keyframes gyro-2 {
            0% { transform: rotateX(-45deg) rotateY(60deg) rotateZ(0deg); }
            50% { transform: rotateX(-70deg) rotateY(20deg) rotateZ(180deg); }
            100% { transform: rotateX(-45deg) rotateY(60deg) rotateZ(360deg); }
        }

        @keyframes gyro-3 {
            0% { transform: rotateX(75deg) rotateY(-50deg) rotateZ(0deg) scale(0.95); }
            100% { transform: rotateX(25deg) rotateY(55deg) rotateZ(240deg) scale(1.08); }
        }

        @keyframes spin-flat {
            0% { transform: rotateZ(0deg) scale(0.98); }
            50% { transform: rotateZ(180deg) scale(1.03); }
            100% { transform: rotateZ(360deg) scale(0.98); }
        }

        @keyframes plasma-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes plasma-breathe {
            0% { transform: scale(0.88) rotate(0deg); }
            100% { transform: scale(1.18) rotate(180deg); }
        }

        @keyframes spark-flicker {
            0%, 100% { opacity: 0.4; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        @keyframes aura-pulse {
            0% { transform: scale(0.85); opacity: 0.4; }
            100% { transform: scale(1.25); opacity: 0.9; }
        }

        @keyframes equalizer {
            0%, 100% { transform: scaleY(0.4); opacity: 0.3; }
            50% { transform: scaleY(1.15); opacity: 1; }
        }

        @keyframes shimmer {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen w-full bg-black select-none">

    <!-- Central Quantum Thinking Visualizer -->
    <div class="relative flex flex-col items-center justify-center">
        
        <!-- 3D Holographic Gyro & Eclipse Core -->
        <div class="quantum-stage">
            <div class="void-aura"></div>

            <!-- 3D Intersecting Light Ribbons -->
            <div class="orbital-ring orbital-4"></div>
            <div class="orbital-ring orbital-1"></div>
            <div class="orbital-ring orbital-2"></div>
            <div class="orbital-ring orbital-3"></div>

            <!-- Iridescent Eclipse Core -->
            <div class="plasma-orb"></div>
            <div class="orb-eclipse"></div>
            <div class="center-spark"></div>
        </div>

        <!-- Synchronized Neural Pulse & Label -->
        <div class="mt-6 flex flex-col items-center gap-3">
            <!-- Minimalist Frequency Bars -->
            <div class="flex items-center justify-center gap-1.5 h-5">
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
            </div>

            <!-- Typography -->
            <span class="thinking-label text-[11px] uppercase tracking-[0.55em] font-light pl-[0.55em]">
                Thinking
            </span>
        </div>

    </div>

</body>
</html>
